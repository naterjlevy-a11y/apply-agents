[project]
name = "apply-agents"
version = "0.1.0"
description = "Local multi-agent internship application helper with a human review checkpoint"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50", "openai>=1.40", "fastapi>=0.110", "uvicorn>=0.29", "python-dotenv>=1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
apply-agents = "apply_agents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apply_agents = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
